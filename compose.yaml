services:
  primary:
    image: postgres:18
    container_name: pg-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: labpass123
      POSTGRES_DB: bootcamp
    ports:
      - "5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql
      - ./backups:/backups
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=cp %p /backups/wal/%f
      - -c
      - max_wal_senders=10
      - -c
      - listen_addresses=*
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bootcamp"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  primary_data:
